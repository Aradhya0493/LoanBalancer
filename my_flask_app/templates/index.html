<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Loan Eligibility Checker</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Reset */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f8fa;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px 40px;
        }

        h2 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 25px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #444;
        }

        input[type="number"],
        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1.8px solid #ddd;
            border-radius: 8px;
            transition: border-color 0.3s ease;
            resize: vertical;
        }

        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            border-color: #1a73e8;
            outline: none;
            box-shadow: 0 0 6px rgba(26,115,232,0.3);
        }

        textarea[readonly],
        input[readonly] {
            background-color: #f0f0f0;
            cursor: not-allowed;
        }

        .row {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .col {
            flex: 1;
            min-width: 280px;
        }

        button {
            margin-top: 30px;
            background-color: #1a73e8;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 0;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            box-shadow: 0 6px 15px rgba(26,115,232,0.4);
        }

        button:hover {
            background-color: #155ab6;
            box-shadow: 0 8px 20px rgba(21,90,182,0.6);
        }

        h3 {
            margin-top: 40px;
            margin-bottom: 20px;
            color: #1a73e8;
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
        }

        canvas {
            max-width: 100%;
            height: 250px;
            background: #f9fafb;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🏦 Loan Eligibility Checker</h2>

    <label for="csvUpload">Upload CSV File</label>
    <input type="file" id="csvUpload" accept=".csv" />

    <label for="companySelect">Select Company</label>
    <select id="companySelect">
        <option value="">-- Select Company --</option>
        {% for company in companies %}
        <option value="{{ company }}">{{ company }}</option>
        {% endfor %}
    </select>

    <div class="row">
        <div class="col">
            <label for="currentRatio">Current Ratio</label>
            <input type="number" id="currentRatio" step="any" placeholder="e.g., 2.5" />

            <label for="debtToEquity">Debt-to-Equity Ratio</label>
            <input type="number" id="debtToEquity" step="any" placeholder="e.g., 0.8" />

            <label for="netProfitMargin">Net Profit Margin (%)</label>
            <input type="number" id="netProfitMargin" step="any" placeholder="e.g., 15" />

            <label for="interestCoverage">Interest Coverage</label>
            <input type="number" id="interestCoverage" step="any" placeholder="e.g., 3" />

            <label for="revenue">Revenue</label>
            <input type="number" id="revenue" step="any" placeholder="e.g., 1500000" />
        </div>

        <div class="col">
            <label>Loan Status</label>
            <textarea id="loanStatus" rows="2" readonly placeholder="Result will appear here"></textarea>

            <label>Reason</label>
            <textarea id="reason" rows="5" readonly placeholder="Reason for eligibility status"></textarea>

            <label>Eligibility Score</label>
            <input type="text" id="eligibilityScore" readonly placeholder="Score will appear here" />
        </div>
    </div>

    <button id="checkBtn">🚀 Check Eligibility</button>
    <button id="dashboardBtn">📊 Go to Dashboard</button>

    <h3>📈 Financial Metrics vs Thresholds</h3>

    <div class="row" style="margin-bottom: 30px;">
        <canvas id="chartCurrentRatio" class="col"></canvas>
        <canvas id="chartDebttoEquityRatio" class="col"></canvas>
    </div>
    <div class="row">
        <canvas id="chartNetProfitMargin" class="col"></canvas>
        <canvas id="chartInterestCoverage" class="col"></canvas>
        <canvas id="chartRevenue" class="col"></canvas>
    </div>
</div>

<script>
    let uploadedCompanies = [];
    let charts = {};

    const csvUpload = document.getElementById("csvUpload");
    const companySelect = document.getElementById("companySelect");
    const checkBtn = document.getElementById("checkBtn");

    const currentRatioInput = document.getElementById("currentRatio");
    const debtToEquityInput = document.getElementById("debtToEquity");
    const netProfitMarginInput = document.getElementById("netProfitMargin");
    const interestCoverageInput = document.getElementById("interestCoverage");
    const revenueInput = document.getElementById("revenue");

    const loanStatus = document.getElementById("loanStatus");
    const reason = document.getElementById("reason");
    const eligibilityScore = document.getElementById("eligibilityScore");

    const thresholds = {
        "Current Ratio": 1.5,
        "Debt-to-Equity Ratio": 1.0,
        "Net Profit Margin": 0.1, // Use 0.1 (10%) if your backend uses 0.1, else 10 for percent
        "Interest Coverage": 2.0,
        "Revenue": 100000
    };

    function createChart(ctx, label) {
        return new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Company Value', 'Threshold'],
                datasets: [{
                    label: label,
                    data: [0, thresholds[label]],
                    backgroundColor: ['#4caf50', '#f44336']
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    title: { display: true, text: label }
                },
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    }

    function updateCharts(metrics) {
        Object.entries(metrics).forEach(([key, val]) => {
            const chartId = `chart${key.replace(/[\s\-]/g, '')}`;
            if (!charts[key]) {
                const ctx = document.getElementById(chartId).getContext('2d');
                charts[key] = createChart(ctx, key);
            }
            charts[key].data.datasets[0].data = [val, thresholds[key]];
            charts[key].update();
        });
    }

    csvUpload.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch("/api/upload_csv", {
            method: "POST",
            body: formData,
        });
        const data = await res.json();

        if (data.error) {
            alert("Error: " + data.error);
            return;
        }

        uploadedCompanies = data.companies;
        companySelect.innerHTML = `<option value="">-- Select Company --</option>`;
        uploadedCompanies.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c;
            opt.innerText = c;
            companySelect.appendChild(opt);
        });
    });

    companySelect.addEventListener("change", async (e) => {
        const company = e.target.value;
        if (!company) return;

        const res = await fetch("/api/get_company_data", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ company })
        });
        const data = await res.json();

        if (data.error) {
            alert("Error: " + data.error);
            return;
        }

        currentRatioInput.value = data["Current Ratio"] || 0;
        debtToEquityInput.value = data["Debt-to-Equity Ratio"] || 0;
        netProfitMarginInput.value = data["Net Profit Margin"] || 0;
        interestCoverageInput.value = data["Interest Coverage"] || 0;
        revenueInput.value = data["Revenue"] || 0;
    });

    checkBtn.addEventListener("click", async () => {
        const payload = {
            "Current Ratio": parseFloat(currentRatioInput.value) || 0,
            "Debt-to-Equity Ratio": parseFloat(debtToEquityInput.value) || 0,
            "Net Profit Margin": parseFloat(netProfitMarginInput.value) || 0,
            "Interest Coverage": parseFloat(interestCoverageInput.value) || 0,
            "Revenue": parseFloat(revenueInput.value) || 0
        };

        const res = await fetch("/predict_loan_approval", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (data.error) {
            alert("Error: " + data.error);
            return;
        }

        loanStatus.value = data.status;
        reason.value = data.reason;
        eligibilityScore.value = data.score;

        updateCharts(data.metrics);
    });

    document.getElementById("dashboardBtn").addEventListener("click", function() {
        window.location.href = "/dashboard";
    });
</script>

</body>
</html>
