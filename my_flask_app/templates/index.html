<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loan Approval System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">📊 Loan Approval System</h1>

    <!-- Loan Eligibility Checker -->
    <div class="card mb-5">
        <div class="card-header">
            <h3>Loan Eligibility Checker</h3>
        </div>
        <div class="card-body">
            <form method="post">
              <div class="row mb-3">
                  <div class="col">
                      <label for="current_ratio" class="form-label">Current Ratio</label>
                      <input type="number" step="any" class="form-control" id="current_ratio" name="current_ratio" required />
                  </div>
                  <div class="col">
                      <label for="debt_to_equity" class="form-label">Debt-to-Equity Ratio</label>
                      <input type="number" step="any" class="form-control" id="debt_to_equity" name="debt_to_equity" required />
                  </div>
              </div>
              <div class="row mb-3">
                  <div class="col">
                      <label for="net_profit_margin" class="form-label">Net Profit Margin</label>
                      <input type="number" step="any" class="form-control" id="net_profit_margin" name="net_profit_margin" required />
                  </div>
                  <div class="col">
                      <label for="interest_coverage" class="form-label">Interest Coverage</label>
                      <input type="number" step="any" class="form-control" id="interest_coverage" name="interest_coverage" required />
                  </div>
                  <div class="col">
                      <label for="revenue" class="form-label">Revenue</label>
                      <input type="number" step="any" class="form-control" id="revenue" name="revenue" required />
                  </div>
              </div>
              <button type="submit" class="btn btn-primary">Check Eligibility</button>
            </form>

            {% if result %}
              <h3>{{ result }}</h3>
              <p>{{ reasons }}</p>
            {% endif %}
        </div>
    </div>

    <!-- Analytics Dashboard -->
    <div class="card">
        <div class="card-header">
            <h3>Loan Analytics Dashboard</h3>
        </div>
        <div class="card-body text-center">
            <a href="{{ url_for('generate_chart') }}" class="btn btn-success mb-3">Generate Monthly Approval Chart</a>
            <br/>
            <img src="{{ chart_url }}" alt="Monthly Approval Trends" class="img-fluid" />
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
